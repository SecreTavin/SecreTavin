  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2de6a0" fill-opacity=".12"/></pattern>
  <clipPath id="clip"><rect width="1000" height="280" rx="18"/></clipPath>
  <clipPath id="pclip"><rect width="176" height="176" rx="12"/></clipPath><linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#2de6a0" stop-opacity="0"/><stop offset=".5" stop-color="#2de6a0" stop-opacity=".09"/><stop offset="1" stop-color="#2de6a0" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1000" height="280" rx="18" fill="url(#bg)"/>
<rect width="1000" height="280" rx="18" fill="url(#dots)"/>
