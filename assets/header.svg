<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 280" width="1000" height="280" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
<style>
.edge{stroke-opacity:.45;animation:edge 3s ease-in-out infinite}
@keyframes edge{0%,100%{stroke-opacity:.3}50%{stroke-opacity:.8}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.scan{animation:sweep 7s linear infinite}
.pscan{animation:pscan 4.5s ease-in-out infinite}
@keyframes pscan{0%{transform:translateY(-4px)}100%{transform:translateY(178px)}}
@keyframes sweep{from{transform:translateX(-200px)}to{transform:translateX(1100px)}}
</style>
<defs>
